# Usiamo H2 file-based per vedere la persistenza e la configurazione esterna
db.url=jdbc:h2:./resources/poggioDatabase;AUTO_SERVER=TRUE
# Per tornare a in-memory (dati persi ad ogni riavvio):
# db.url=jdbc:h2:mem:giocoavventura;DB_CLOSE_DELAY=-1

db.user=sa
db.password=
db.driverClassName=org.h2.Driver

# Numero massimo di connessioni nel pool
hikaricp.maximumPoolSize=10
# Tempo massimo attesa per una connessione (millisecondi)
hikaricp.connectionTimeout=30000
# Tempo massimo di inattività di una connessione (millisecondi)
hikaricp.idleTimeout=600000
# Tempo massimo di vita di una connessione (millisecondi)
hikaricp.maxLifetime=1800000
# Nome del pool (utile nei log)
hikaricp.poolName=PoggioPool