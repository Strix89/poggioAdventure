# Server configuration
server.port=8080

# H2 Database Configuration (in-memory)
# spring.datasource.url=jdbc:h2:mem:gamedb;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# H2 Database Configuration (file-based, salverà i dati in ./gamedb.mv.db)
spring.datasource.url=jdbc:h2:file:./gamedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update # Crea/aggiorna lo schema automaticamente
spring.jpa.show-sql=true # Mostra le query SQL eseguite (utile per debug)

# H2 Web Console (accessibile a http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom Properties
file.upload-dir=./uploads